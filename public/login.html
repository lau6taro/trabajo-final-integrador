<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>Acceso · Ferretería Avenida</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6f8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(100%,430px);background:#fff;border:1px solid #e5e9ef;border-radius:18px;padding:28px;box-shadow:0 18px 55px #17203312}
    h1{font-size:23px;margin:0 0 5px}.sub{margin:0 0 24px;color:#6b7485;font-size:14px}
    label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px;color:#596477}
    input{width:100%;padding:12px;border:1px solid #dfe4eb;border-radius:9px;font:inherit;outline:none}input:focus{border-color:#f28c28;box-shadow:0 0 0 3px #f28c281c}
    button{width:100%;border:0;border-radius:9px;padding:12px;margin-top:18px;background:#f28c28;color:#fff;font-weight:800;font:inherit;cursor:pointer}
    button.secondary{background:#eef1f5;color:#172033;margin-top:10px}.link{display:block;text-align:center;color:#a95608;font-size:13px;margin-top:17px;cursor:pointer}
    .msg{min-height:20px;margin:13px 0 0;font-size:13px;line-height:1.45}.hidden{display:none}.note{font-size:12px;color:#6b7485;line-height:1.5;margin:10px 0}
  </style>
</head>
<body>
  <main class="card">
    <h1>Ferretería Avenida</h1>
    <p class="sub">Inventario y control de stock</p>

    <form id="form-login">
      <label for="identificador">Usuario o email</label>
      <input id="identificador" name="identificador" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
      <a class="link" id="mostrar-recuperacion">Olvidé mi contraseña</a>
    </form>

    <form id="form-recuperar" class="hidden">
      <label for="email-recuperacion">Email de la cuenta</label>
      <input id="email-recuperacion" type="email" autocomplete="email" required>
      <button type="submit">Generar código</button>
      <p class="note">La recuperación está implementada en modalidad simulada. El código se registra en Deploy Logs del servicio Railway y vence a los 15 minutos.</p>
      <a class="link" id="mostrar-restablecer">Ya tengo el código</a>
      <a class="link" id="volver-login">Volver al inicio de sesión</a>
    </form>

    <form id="form-restablecer" class="hidden">
      <label for="email-reset">Email de la cuenta</label>
      <input id="email-reset" type="email" required>
      <label for="codigo-reset">Código de 6 dígitos</label>
      <input id="codigo-reset" inputmode="numeric" maxlength="6" required>
      <label for="password-nueva">Nueva contraseña (mínimo 10 caracteres)</label>
      <input id="password-nueva" type="password" minlength="10" autocomplete="new-password" required>
      <button type="submit">Restablecer contraseña</button>
      <a class="link" id="volver-recuperacion">Volver</a>
    </form>
    <p class="msg" id="mensaje" role="status" aria-live="polite"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    function mostrar(formulario) {
      ['form-login','form-recuperar','form-restablecer'].forEach((id) => $(id).classList.toggle('hidden', id !== formulario));
      $('mensaje').textContent = '';
    }
    async function enviar(url, body) {
      const respuesta = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const datos = await respuesta.json();
      if (!respuesta.ok) throw new Error(datos.error || 'No se pudo completar la operación.');
      return datos;
    }

    $('form-login').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      try {
        await enviar('/api/auth/login', {
          identificador: $('identificador').value,
          password: $('password').value
        });
        location.replace('/');
      } catch (error) {
        $('mensaje').textContent = error.message;
        $('mensaje').style.color = '#c83c3c';
      }
    });

    $('form-recuperar').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      try {
        const datos = await enviar('/api/auth/recuperar', { email: $('email-recuperacion').value });
        $('mensaje').textContent = datos.mensaje;
        $('mensaje').style.color = '#18864b';
        $('email-reset').value = $('email-recuperacion').value;
      } catch (error) {
        $('mensaje').textContent = error.message;
        $('mensaje').style.color = '#c83c3c';
      }
    });

    $('form-restablecer').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      try {
        const datos = await enviar('/api/auth/restablecer', {
          email: $('email-reset').value,
          codigo: $('codigo-reset').value,
          password: $('password-nueva').value
        });
        mostrar('form-login');
        $('mensaje').textContent = datos.mensaje;
        $('mensaje').style.color = '#18864b';
        $('password').value = '';
      } catch (error) {
        $('mensaje').textContent = error.message;
        $('mensaje').style.color = '#c83c3c';
      }
    });

    $('mostrar-recuperacion').addEventListener('click', () => mostrar('form-recuperar'));
    $('mostrar-restablecer').addEventListener('click', () => mostrar('form-restablecer'));
    $('volver-login').addEventListener('click', () => mostrar('form-login'));
    $('volver-recuperacion').addEventListener('click', () => mostrar('form-recuperar'));

    fetch('/api/auth/me').then((respuesta) => {
      if (respuesta.ok) location.replace('/');
    }).catch(() => {});
  </script>
</body>
</html>
